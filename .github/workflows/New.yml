name: Recovery Builder (ARM32)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Branch of TWRP/Omni Manifest'
        required: true
        default: 'twrp-9.0'
      BUILD_TARGET:
        description: 'Target to build (recovery/boot)'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Cleanup and Install Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo apt update
        sudo apt install -y bc build-essential zip curl libstdc++6 git wget python3 python2
        
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Prepare Workspace and Init Repo
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.email "salim.alqaaod1@gmail.com"
        git config --global user.name "salimalqaaod1-lgtm"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync

    - name: Generate Device Tree
      run: |
        cd workspace
        wget https://github.com/salimalqaaod1-lgtm/Auto-Twrp-Builder/tree/master/recovery.img
        python3 ${GITHUB_WORKSPACE}/scripts/build.py -i recovery.img -o device
        # استخراج اسم المجلد الناتج تلقائياً
        echo "DEVICE_NAME=$(ls device/allwinner | head -1)" >> $GITHUB_ENV 
      continue-on-error: false

    - name: Switch to Python2
      run: |
        sudo rm -rf /usr/bin/python
        sudo ln -s /usr/bin/python2 /usr/bin/python
      continue-on-error: true

    - name: Building recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export ARCH=arm
        
        # محاولة البحث عن اسم الـ lunch الصحيح
        LUNCH_NAME=$(find device -name "twrp_*.mk" | sed 's/.*\///' | sed 's/\.mk//')
        lunch ${LUNCH_NAME}-eng || lunch omni_${DEVICE_NAME}-eng
        
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: | 
          workspace/out/target/product/*/*.img
          workspace/out/target/product/*/*.zip
        name: Recovery-Build-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
